# render.yaml — CineVerse Render deployment configuration
# Docs: https://render.com/docs/render-yaml-spec

services:
  # ── Spring Boot Backend ─────────────────────────────────────
  - type: web
    name: cineverse-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health

    # ── Environment Variables ─────────────────────────────────
    # DO NOT put secrets here — add them in the Render dashboard.
    # Only non-secret defaults belong in this file.
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      # The following are placeholders — set real values in Render dashboard:
      # NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD, TMDB_API_KEY, CORS_ALLOWED_ORIGINS

  # ── Python ML Service ───────────────────────────────────────
  - type: web
    name: cineverse-ml
    runtime: python
    rootDir: ml
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/ml/health
