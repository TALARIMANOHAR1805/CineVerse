<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>CineVerse — Discover Movies & Anime</title>
    <meta name="description" content="CineVerse is your premium movie and anime discovery platform. Search millions of titles, explore trending content, find where to stream, and manage your personal watchlist — all for free." />
    <meta name="keywords" content="movies, anime, watchlist, discover, streaming, TMDB, Jikan, film, CineVerse" />
    <meta name="author" content="CineVerse" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="CineVerse — Discover Movies & Anime" />
    <meta property="og:description" content="Search movies and anime, find where to stream, manage your watchlist. Free, no sign-up needed." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cineverse-frontend.vercel.app" />
    <meta property="og:image" content="https://cineverse-frontend.vercel.app/og-image.png" />
    <meta property="og:site_name" content="CineVerse" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@CineVerseApp" />
    <meta name="twitter:title" content="CineVerse — Discover Movies & Anime" />
    <meta name="twitter:description" content="Search movies and anime, find where to stream, manage your watchlist." />
    <meta name="twitter:image" content="https://cineverse-frontend.vercel.app/og-image.png" />

    <!-- Theme & PWA -->
    <meta name="theme-color" content="#080b14" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="CineVerse" />

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />

    <!-- Performance: preconnect to external resources -->
    <link rel="preconnect" href="https://api.themoviedb.org" />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://api.jikan.moe" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts — loaded via CSS @import for caching -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
