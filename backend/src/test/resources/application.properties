# ── Test overrides ────────────────────────────────────────────────────────────
# These values let the Spring context start in CI without a real Neo4j or TMDB key.
# All Neo4j-dependent beans are mocked in the individual tests.

# Dummy credentials — context starts, Neo4j driver won't actually connect
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=test

# Shorten timeouts so tests don't hang waiting for an unreachable DB
spring.neo4j.pool.connection-acquisition-timeout=PT1S
spring.neo4j.connection-timeout=PT1S

# Dummy TMDB key — TmdbService is not exercised in unit tests
tmdb.api.key=test-key-ci
tmdb.api.base-url=https://api.themoviedb.org/3

# Suppress Neo4j health check (same as prod — paused Aura shouldn't fail CI)
management.health.neo4j.enabled=false

# Reduce log noise in test output
logging.level.com.cineverse=WARN
logging.level.org.springframework.data.neo4j=WARN
logging.level.org.neo4j=WARN
