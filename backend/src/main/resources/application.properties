# ── Server ─────────────────────────────────────────────────
server.port=8080

# ── Application name (shows in logs + Actuator) ────────────
spring.application.name=cineverse-backend

# ── Actuator ───────────────────────────────────────────────
# Expose /actuator/health (built-in Spring health endpoint)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Logging ────────────────────────────────────────────────
logging.level.com.cineverse=DEBUG

# ── Neo4j (populated via .env — not stored here) ───────────
# spring.neo4j.uri=${NEO4J_URI}
# spring.neo4j.authentication.username=${NEO4J_USERNAME}
# spring.neo4j.authentication.password=${NEO4J_PASSWORD}

