# ── Server ─────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Application name (shows in logs + Actuator) ────────────
spring.application.name=cineverse-backend

# ── Actuator ───────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Don't let a paused Neo4j Aura DB pull the whole health check DOWN
management.health.neo4j.enabled=false

# ── Logging ────────────────────────────────────────────────
logging.level.com.cineverse=DEBUG

# ── Neo4j (populated via .env — not stored here) ───────────
spring.neo4j.uri=${NEO4J_URI}
spring.neo4j.authentication.username=${NEO4J_USERNAME}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
# Fail fast on connection errors (don't hang for 30s)
spring.neo4j.pool.connection-acquisition-timeout=PT5S
spring.neo4j.connection-timeout=PT5S

# ── TMDB / Jikan (populated via .env) ──────────────────────
tmdb.api.key=${TMDB_API_KEY}
tmdb.api.base-url=https://api.themoviedb.org/3
