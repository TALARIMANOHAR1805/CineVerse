name: CI — CineVerse

# Trigger on every push to main and every pull request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Backend: Maven compile (skip tests needing live DB) ──────
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      # Only compile — tests need real Neo4j + TMDB keys, use continue-on-error
      - name: Compile (no tests)
        run: ./mvnw clean compile -DskipTests -B
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || 'ci-placeholder' }}
          NEO4J_URI: ${{ secrets.NEO4J_URI || 'bolt://localhost:7687' }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME || 'neo4j' }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD || 'ci-password' }}

      - name: Run unit tests
        continue-on-error: true
        run: ./mvnw test -B -Dspring.profiles.active=test
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || 'ci-placeholder' }}
          NEO4J_URI: ${{ secrets.NEO4J_URI || 'bolt://localhost:7687' }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME || 'neo4j' }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD || 'ci-password' }}

  # ── ML Service: install deps + basic smoke test ──────────────
  ml:
    name: ML Service (Python 3.11 / FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FastAPI smoke test
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8001 &
          sleep 5
          curl -f http://localhost:8001/health
          echo "ML health check passed ✓"

  # ── Frontend: install + build ────────────────────────────────
  frontend:
    name: Frontend (Node / Vite + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8080
