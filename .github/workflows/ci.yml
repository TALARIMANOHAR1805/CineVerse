name: CI — CineVerse

on:
  push:
    branches: [main, 'koushik/**']
  pull_request:
    branches: [main]

jobs:

  # ── Backend: Java 21 / Maven ───────────────────────────────
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and compile
        run: mvn clean compile -DskipTests -B --no-transfer-progress
        working-directory: backend

      - name: Run unit tests (skip Neo4j integration tests)
        run: mvn test -B --no-transfer-progress
            -Dspring.neo4j.uri=bolt://localhost:7687
            -Dspring.neo4j.authentication.username=neo4j
            -Dspring.neo4j.authentication.password=test
        working-directory: backend
        continue-on-error: true

  # ── ML Service: Python 3.11 / pytest ────────────────────────
  ml:
    name: ML Service (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ml

      - name: Run pytest
        run: pytest tests/ -v --tb=short
        working-directory: ml

  # ── Frontend: Node 20 / Vite ────────────────────────────────
  frontend:
    name: Frontend (Node 20 / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build (Vite)
        run: npm run build
        working-directory: frontend
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_API_BASE_URL: ''
